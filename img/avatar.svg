<svg width="360" height="360" viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#1B2438"/>
      <stop offset="100%" stop-color="#0B0F1A"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#F97362"/>
    </linearGradient>
  </defs>

  <circle cx="180" cy="180" r="178" fill="url(#bg)" stroke="url(#ring)" stroke-width="2"/>

  <!-- network nodes/edges motif -->
  <g stroke="#5EEAD4" stroke-width="1.4" opacity="0.55">
    <line x1="70" y1="90" x2="150" y2="60"/>
    <line x1="150" y1="60" x2="250" y2="80"/>
    <line x1="250" y1="80" x2="300" y2="150"/>
    <line x1="70" y1="90" x2="60" y2="180"/>
    <line x1="60" y1="180" x2="90" y2="270"/>
    <line x1="300" y1="150" x2="290" y2="250"/>
    <line x1="90" y1="270" x2="180" y2="300"/>
    <line x1="180" y1="300" x2="290" y2="250"/>
  </g>
  <g fill="#F97362">
    <circle cx="70" cy="90" r="4"/>
    <circle cx="150" cy="60" r="3.2"/>
    <circle cx="250" cy="80" r="3.2"/>
    <circle cx="300" cy="150" r="4"/>
    <circle cx="60" cy="180" r="3.2"/>
    <circle cx="290" cy="250" r="4"/>
    <circle cx="90" cy="270" r="3.2"/>
    <circle cx="180" cy="300" r="4"/>
  </g>

  <circle cx="180" cy="180" r="96" fill="#131A2A" stroke="#5EEAD4" stroke-width="1.5" opacity="0.9"/>
  <text x="180" y="200" font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-size="72" font-weight="700" fill="#E8ECF4" text-anchor="middle">CM</text>
</svg>
